apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: creatoros
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-worker
          image: creatoros-ai-analytics-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.analytics_worker"]
          envFrom:
            - configMapRef:
                name: creatoros-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: ENCRYPTION_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
