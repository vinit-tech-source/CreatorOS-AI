apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migration
  namespace: creatoros
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alembic-migration
          image: creatoros-ai-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: creatoros-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: SECRET_KEY
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: ENCRYPTION_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: creatoros-secrets
                  key: GEMINI_API_KEY
      restartPolicy: OnFailure
